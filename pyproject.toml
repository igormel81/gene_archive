[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gene-archive"
version = "0.7.0"
description = "Your family's website: the tree, the documents and your ancestors' stories — every fact backed by its document. A static site generator with an online editor, GEDCOM, in English, Russian, Romanian and Ukrainian"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "Igor Melnikov"}]
requires-python = ">=3.10"
dependencies = []
keywords = ["genealogy", "family tree", "gedcom", "static site", "family history", "родословная"]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Sociology :: Genealogy",
  "Natural Language :: Russian",
  "Natural Language :: English",
  "Natural Language :: Romanian",
  "Natural Language :: Ukrainian",
]

[project.optional-dependencies]
images = ["Pillow>=10"]

[project.scripts]
gene = "gene_archive.cli:main"

[project.urls]
Homepage = "https://github.com/igormel81/gene_archive"
Documentation = "https://github.com/igormel81/gene_archive/tree/main/docs"

[tool.setuptools]
packages = ["gene_archive"]

[tool.setuptools.package-data]
gene_archive = ["templates/*.md", "editor_web/*", "engine/*.html", "engine/web/*", "engine/web/vendor/leaflet/*", "engine/i18n/*.json"]
