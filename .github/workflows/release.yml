# A release is made by a version tag (git tag v0.2.0 && git push origin v0.2.0) or by running this
# workflow by hand (Actions → Release → Run workflow): then the tag v<version from pyproject.toml>
# is created on the current main. Either way:
#  - checks that the tag matches the version in pyproject.toml and that the tests pass;
#  - builds the Python package and creates a GitHub release with the CHANGELOG section and the files;
#  - publishes the Docker image ghcr.io/igormel81/gene_archive:<version> and :latest;
#  - publishes to PyPI only when the repository variable PYPI_PUBLISH is "true"
#    (set up trusted publishing on pypi.org first: docs/deploy.md → "Releases").
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches pyproject.toml
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then tag="v$version"; else tag="$GITHUB_REF_NAME"; fi
          test "v$version" = "$tag" || { echo "::error::tag $tag, pyproject.toml $version"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        id: tag
      - run: pip install ".[images]" build && python -m unittest discover tests
      - run: python -m build
      - name: Release notes from CHANGELOG.md
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## "v" " {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
          printf '\n**Install:** `pip install "gene-archive[images] @ git+https://github.com/igormel81/gene_archive@%s"` · **Docker:** `ghcr.io/igormel81/gene_archive:%s` · **Demo:** https://igormel81.github.io/gene_archive/\n' "$TAG" "$v" >> notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then where="--target $GITHUB_SHA"; else where="--verify-tag"; fi
          gh release create "$TAG" dist/* --title "gene-archive $TAG" --notes-file notes.md $where
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          v="${TAG#v}"
          docker build -t "$image:$v" -t "$image:latest" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.licenses=MIT \
            --label org.opencontainers.image.description="Family archive site generator with a comments server" .
          docker push "$image:$v"
          docker push "$image:latest"

  pypi:
    needs: release
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gene-archive
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
