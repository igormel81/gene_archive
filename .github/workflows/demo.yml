# Publishes the fictional demo family on GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Demo site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["gene_archive/**", "example/**", ".github/workflows/demo.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y --no-install-recommends poppler-utils && pip install ".[images]"
      - id: pages
        uses: actions/configure-pages@v5
      - run: gene build example -o _site --base-url "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
